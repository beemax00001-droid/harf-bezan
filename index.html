<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حرف بزنیم؟</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="page">

<section id="ownerView" class="panel hidden"><h1>پنل</h1><p id="ownerAnswer" class="answer">هنوز انتخابی ثبت نشده.</p><button id="resetBtn" class="btn yes">شروع مجدد</button></section>
